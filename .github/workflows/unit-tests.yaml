name: FastAPI PostgreSQL Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  run-unit-tests:
    name: Execute FastAPI Unit Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}

      - name: Setup UV Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          python-version: ${{matrix.python-version}}
          enable-cache: true

      - name: Install Dependecies with UV
        env:
          UV_SYSTEM_PYTHON: 1
        run: |
          uv pip install --no-cache -r pyproject.toml

      - name: Run Pytest for Unit Test folder Only
        env:
          ENDPOINT: http://localhost:8000
          API_PREFIX: /api
        run: pytest tests/unit/ -v
